<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    {% block head_links %}{% endblock %}
</head>
<body class="background">
    <main class="blank-container">

        <div class="logo-container">
            <img class="logo" src="../static/img/logo-gdf-redondo.png" alt="Logo">
            <h1 class="title">
        </div>

        <h2 class="welcome-msg">{% block welcome_msg %}{% endblock %}</h2>

        {% block form %}{% endblock %}

    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
