<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="../static/css/admin.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../static/img/logo.ico">
</head>
<body class="background">

    <button type="button" class="admin-bt">Área do sistema</button>

    <div class="overlay"></div>
    <div class="popup">

        <form class="popup__form" method="post" action="{{ url_for('admin.admin_edit') }}">
            <div class="popup__input-container">
                <input style="display: none;" name="id" class="hidden-id">
                <label class="popup__boldtext">Usuário:</label>
                <input class="popup__username" name="popup__username">
            </div>

            <div class="popup__radio-container">
                <p class="popup__boldtext">Ativo?</p>
                <input type="radio" name="is-active" value="true">
                <label>Sim</label>
                <input type="radio" name="is-active" value="false" checked>
                <label>Não</label>
            </div>

            <div class="popup__radio-container">
                <p class="popup__boldtext">É admin?</p>
                <input type="radio" name="is-admin" value="true">
                <label>Sim</label>
                <input type="radio" name="is-admin" value="false" checked>
                <label>Não</label>
            </div>

            <button type="submit" class="popup__submit">Confirmar</button>
        </form>
    </div>

    <main class="main-container">

        <h1 class="h1">Usuários cadastrados</h1>

        <div class="users-container">

            <form method="post" action="{{ url_for ('admin.admin_view_info')}}">
            <ul class="users-list"></ul>
            {% for user in users %}
                <li id="{{ user.id }}" class="user">
                    <p class="username">{{ user.username }}</p>
                    <button type="button" class="edit-bt"><img src="../static/img/edit.png"></button>
                    <button type="button" class="delete-bt"><img src="../static/img/delete.png"></button>
                </li>
            {% endfor %}
            </ul>
            </form>

        </div>

        <button class="new-user-bt" type="button">Novo usuário</button>
        <button class="run-report-bt" type="button"">Gerar relatório</button>
    </main>

    <div class="new-user-popup">

        <p class="side-msg"></p>

        <form class="popup__form" method="post" action="{{ url_for('admin.admin_new') }}">
            <div class="popup__input-container">
                <label class="popup__boldtext">Usuário:</label>
                <input class="popup__username" name="popup__username">
            </div>

            <div class="popup__input-container">
                <label class="popup__boldtext">Senha:</label>
                <input type="password" class="pass" name="first-pass">
                <label class="popup__boldtext">Confirme sua senha:</label>
                <input type="password" class="pass" name="second-pass">
            </div>

            <div class="popup__radio-container">
                <p class="popup__boldtext">É admin?</p>
                <input type="radio" name="is-admin" value="true">
                <label>Sim</label>
                <input type="radio" name="is-admin" value="false" checked>
                <label>Não</label>
            </div>

            <button type="button" class="new-user-popup__submit">Confirmar</button>

        </form>
    </div>

    <div class="report-box">
        <h2>Gerar Relatório</h2>
        <p class="report-box__side-msg"></p>

        <form method="POST" action="/admin/run_reports/">
            <div class="report-box__input-container">
                <label for="start-date">Data de Início</label>
                <input class="start-date" name="start-date" required>
            </div>

            <div class="report-box__input-container">
                <label for="final-date">Data de Fim</label>
                <input class="final-date" name="final-date" required>
            </div>

            <button class="generate-report-bt" type="button">Gerar</button>
        </form>
    </div>

    <script type="module" src="../static/js/admin/admin_main.js"></script>
</body>
</html>
