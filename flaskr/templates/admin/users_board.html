<main class="main-container">

    <h1 class="h1">Usuários cadastrados</h1>

    <div class="users-container">

        <form method="post" action="{{ url_for ('admin.admin_view_info')}}">
        <ul class="users-list"></ul>
        {% for user in users %}
            <li id="{{ user.id }}" class="user">
                <p class="username">{{ user.username }}</p>
                <button type="button" class="edit-bt"><img src="../static/img/edit.png"></button>
                <button type="button" class="delete-bt"><img src="../static/img/delete.png"></button>
            </li>
        {% endfor %}
        </ul>
        </form>

    </div>

    <button class="new-user-bt" type="button">Novo usuário</button>
    <button class="run-report-bt" type="button"">Gerar relatório</button>
</main>
