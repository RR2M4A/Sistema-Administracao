<div class="popup search-client-popup">

    <button type="button" class="close-popup-bt"><img src="../static/img/x.png"></button>
    <h2 class="popup-msg">Informações do cliente</h2>

    <p class="popup-side-msg"></p>
    <form class="popup-form" method="post" action="{{ url_for('system.system_update_client') }}">

        <div class="radio-container">
            <input name="edit" class="radio-bt" type="radio" value="edit">
            <label>Editar</label>

            <input name="edit" class="radio-bt" type="radio" value="no-edit" checked>
            <label>Não editar</label>
        </div>

        <div class="input-container name-container">
            <label for="search-name">Nome</label>
            <input type="text" id="search-name" name="name">
        </div>

        <div class="input-container">

            <div class="inner-input-container">
                <label for="search-rg">RG</label>
                <input type="text" id="search-rg" name="rg">
            </div>

            <div class="inner-input-container">
                <label for="search-cpf">CPF</label>
                <input type="text" id="search-cpf" name="cpf">
            </div>
        </div>

        <div class="input-container">

            <div class="inner-input-container">
                <label for="search-phone-number">Telefone</label>
                <input type="text" id="search-phone-number" name="phone-number">
            </div>

            <div class="inner-input-container">
                <label for="search-birth-date">Data de Nascimento</label>
                <input type="text" id="search-birth-date" name="birth-date">
            </div>
        </div>

        <div class="input-container">
            <button name="bt" value="visit" class="primary-button visit-bt" type="button">Registrar visita</button>
            <button name="bt" value="edit" class="primary-button edit-bt" type="button">Editar</button>
        </div>

        <input type="text" name="client-id" class="client-id" style="display: none">

    </form>
</div>
